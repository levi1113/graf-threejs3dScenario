<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - FBX loader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - FBXLoader<br />
			Character and animation from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo</a>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import Stats from 'three/addons/libs/stats.module.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			// ---------------------------------------------------------------------
			import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
			import { Audio, AudioListener, AudioLoader, TextureLoader } from 'three';
			// ---------------------------------------------------------------------

			const manager = new THREE.LoadingManager();

			let camera, scene, renderer, stats, object, loader, guiMorphsFolder;
			let mixer;

			const clock = new THREE.Clock();

			const params = {
				asset: 'HipHopDancing'
			};

			const assets = [
				'HipHopDancing',
			];

			init();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 2000 );
				camera.position.set( 100, 200, 300 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xa0a0a0 );
				// Bruma azul oscura (efecto adicional)
				scene.fog = new THREE.Fog(0x555577, 150, 800);

				// Luces
				const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 5 );
				hemiLight.position.set( 0, 200, 0 );
				scene.add( hemiLight );

				const dirLight = new THREE.DirectionalLight( 0xffffff, 5 );
				dirLight.position.set( 0, 200, 100 );
				dirLight.castShadow = true;
				dirLight.shadow.camera.top = 180;
				dirLight.shadow.camera.bottom = - 100;
				dirLight.shadow.camera.left = - 120;
				dirLight.shadow.camera.right = 120;
				scene.add( dirLight );

				// Piso con textura rocosa (efecto adicional)
				const textureLoader = new TextureLoader();
				const floorTexture = textureLoader.load('models/rgbe/textures/piso.jpg');
				floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
				floorTexture.repeat.set( 20, 20 );

				const floorMaterial = new THREE.MeshPhongMaterial({ map: floorTexture });
				const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), floorMaterial);
				mesh.rotation.x = -Math.PI / 2;
				mesh.receiveShadow = true;
				scene.add(mesh);

				const grid = new THREE.GridHelper( 2000, 20, 0x000000, 0x000000 );
				grid.material.opacity = 0.1;
				grid.material.transparent = true;
				scene.add( grid );
			
				loader = new FBXLoader( manager );
				loadAsset( params.asset );

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				container.appendChild( renderer.domElement );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 100, 0 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

				// stats
				stats = new Stats();
				container.appendChild( stats.dom );

				const gui = new GUI();
				gui.add( params, 'asset', assets ).onChange( function ( value ) {
					loadAsset( value );
				} );

				guiMorphsFolder = gui.addFolder( 'Morphs' ).hide();

				// --------------------------------------------------------------
				// Escenario HDR tipo cueva
				const rgbeLoader = new RGBELoader();
				rgbeLoader.load('models/rgbe/newman_lobby_4k.hdr', function (texture) {
					texture.mapping = THREE.EquirectangularReflectionMapping;
					scene.background = texture;
					scene.environment = texture;
				});

				// Música de fondo medieval
				const listener = new AudioListener();
				camera.add(listener);

				const sound = new Audio(listener);
				const audioLoader = new AudioLoader();
				audioLoader.load('models/rgbe/musica.mp3', function (buffer) {
					console.log("Audio disco cargado exitosamente");
					sound.setBuffer(buffer);
					sound.setLoop(true);
					sound.setVolume(0.6);

					// Botón para iniciar la música
					const playButton = document.createElement('button');
					playButton.textContent = "Reproducir música";
					playButton.style.position = 'absolute';
					playButton.style.top = '200px';
					playButton.style.right = '20px';
					playButton.style.padding = '10px 20px';
					playButton.style.fontSize = '16px';
					playButton.style.cursor = 'pointer';
					playButton.style.zIndex = '100';
					playButton.style.background = 'rgba(0,0,0,0.5)';
					playButton.style.color = 'white';
					playButton.style.border = '1px solid white';
					playButton.style.borderRadius = '8px';
					document.body.appendChild(playButton);

					playButton.addEventListener('click', () => {
						sound.play();
						playButton.remove();
					});
				});
				// --------------------------------------------------------------
			}

			function loadAsset( asset ) {

				loader.load( 'models/fbx/' + asset + '.fbx', function ( group ) {

					if ( object ) {

						object.traverse( function ( child ) {

							if ( child.material ) {

								const materials = Array.isArray( child.material ) ? child.material : [ child.material ];
								materials.forEach( material => {

									if ( material.map ) material.map.dispose();
									material.dispose();
			
								} );
			
							}
			
							if ( child.geometry ) child.geometry.dispose();

						} );

						scene.remove( object );

					}

					object = group;

					if ( object.animations && object.animations.length ) {

						mixer = new THREE.AnimationMixer( object );

						const action = mixer.clipAction( object.animations[ 0 ] );
						action.play();

					} else {

						mixer = null;

					}

					guiMorphsFolder.children.forEach( ( child ) => child.destroy() );
					guiMorphsFolder.hide();

					object.traverse( function ( child ) {

						if ( child.isMesh ) {

							// -----------------------------------------------------------
							// Textura metálica brillante (modelo FBX)
							child.material = new THREE.MeshStandardMaterial({
								color: 0xaaa066,   // tono cálido tipo bronce
								transparent: true,
								opacity: 0.95,
								roughness: 0.4,
								metalness: 0.8
							});
							// -----------------------------------------------------------

							child.castShadow = true;
							child.receiveShadow = true;

							if ( child.morphTargetDictionary ) {

								guiMorphsFolder.show();
								const meshFolder = guiMorphsFolder.addFolder( child.name || child.uuid );
								Object.keys( child.morphTargetDictionary ).forEach( ( key ) => {
			
									meshFolder.add( child.morphTargetInfluences, child.morphTargetDictionary[ key ], 0, 1, 0.01 );
			
								} );
			
							}

						}

					} );

					scene.add( object );

				} );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				const delta = clock.getDelta();

				if ( mixer ) mixer.update( delta );

				renderer.render( scene, camera );

				stats.update();

			}

		</script>
	</body>
</html>
