<!DOCTYPE html>
<html lang="en">
<head>
	<title>three.js webgl - FBX loader</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link type="text/css" rel="stylesheet" href="./main.css">
</head>

<body>
	<div id="info">
		<a href="https://threejs.org" target="_blank">three.js</a> - FBXLoader<br />
		Character and animation from <a href="https://www.mixamo.com/" target="_blank">Mixamo</a>
	</div>

	<script type="importmap">
	{
		"imports": {
			"three": "./build/three.module.js",
			"three/addons/": "./examples/jsm/"
		}
	}
	</script>

	<script type="module">

	import * as THREE from 'three';
	import Stats from 'three/addons/libs/stats.module.js';
	import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
	import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
	import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
	import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
	import { Audio, AudioListener, AudioLoader, TextureLoader } from 'three';

	const manager = new THREE.LoadingManager();

	let camera, scene, renderer, stats, object, loader, guiMorphsFolder;
	let mixer;

	const clock = new THREE.Clock();

	const params = { asset: 'HipHopDancing' };
	const assets = [ 'HipHopDancing' ];

	init();

	function init() {

		const container = document.createElement('div');
		document.body.appendChild(container);

		camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
		camera.position.set(100, 200, 300);

		scene = new THREE.Scene();
		scene.background = new THREE.Color(0xa0a0a0);
		scene.fog = new THREE.Fog(0x555577, 150, 800);

		const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 5);
		hemiLight.position.set(0, 200, 0);
		scene.add(hemiLight);

		const dirLight = new THREE.DirectionalLight(0xffffff, 5);
		dirLight.position.set(0, 200, 100);
		dirLight.castShadow = true;
		scene.add(dirLight);

		// Piso
		const textureLoader = new TextureLoader();
		const floorTexture = textureLoader.load('./examples/models/rgbe/textures/piso.jpg');
		floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
		floorTexture.repeat.set(20, 20);

		const floorMaterial = new THREE.MeshPhongMaterial({ map: floorTexture });
		const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), floorMaterial);
		mesh.rotation.x = -Math.PI / 2;
		mesh.receiveShadow = true;
		scene.add(mesh);

		const grid = new THREE.GridHelper(2000, 20);
		scene.add(grid);

		loader = new FBXLoader(manager);
		loadAsset(params.asset);

		renderer = new THREE.WebGLRenderer({ antialias: true });
		renderer.setSize(window.innerWidth, window.innerHeight);
		renderer.setAnimationLoop(animate);
		renderer.shadowMap.enabled = true;
		container.appendChild(renderer.domElement);

		const controls = new OrbitControls(camera, renderer.domElement);
		controls.target.set(0, 100, 0);
		controls.update();

		window.addEventListener('resize', onWindowResize);

		stats = new Stats();
		container.appendChild(stats.dom);

		const gui = new GUI();
		gui.add(params, 'asset', assets).onChange(loadAsset);
		guiMorphsFolder = gui.addFolder('Morphs').hide();

		// HDR
		const rgbeLoader = new RGBELoader();
		rgbeLoader.load('./examples/models/rgbe/newman_lobby_4k.hdr', function (texture) {
			texture.mapping = THREE.EquirectangularReflectionMapping;
			scene.background = texture;
			scene.environment = texture;
		});

		// AUDIO
		const listener = new AudioListener();
		camera.add(listener);

		const sound = new Audio(listener);
		const audioLoader = new AudioLoader();

		audioLoader.load('./examples/models/rgbe/musica.mp3', function (buffer) {

			sound.setBuffer(buffer);
			sound.setLoop(true);
			sound.setVolume(0.6);

			const btn = document.createElement('button');
			btn.textContent = "Reproducir música";
			btn.style.position = 'absolute';
			btn.style.top = '200px';
			btn.style.right = '20px';
			btn.style.padding = '10px';
			document.body.appendChild(btn);

			btn.onclick = () => {
				sound.play();
				btn.remove();
			};
		});
	}

	function loadAsset(asset) {

		loader.load('./examples/models/fbx/' + asset + '.fbx', function (group) {

			if (object) scene.remove(object);

			object = group;

			if (object.animations.length) {
				mixer = new THREE.AnimationMixer(object);
				mixer.clipAction(object.animations[0]).play();
			}

			object.traverse(child => {
				if (child.isMesh) {
					child.material = new THREE.MeshStandardMaterial({
						color: 0xaaa066,
						metalness: 0.8,
						roughness: 0.4
					});
					child.castShadow = true;
				}
			});

			scene.add(object);
		});
	}

	function onWindowResize() {
		camera.aspect = window.innerWidth / window.innerHeight;
		camera.updateProjectionMatrix();
		renderer.setSize(window.innerWidth, window.innerHeight);
	}

	function animate() {
		const delta = clock.getDelta();
		if (mixer) mixer.update(delta);
		renderer.render(scene, camera);
		stats.update();
	}

	</script>
</body>
</html>
